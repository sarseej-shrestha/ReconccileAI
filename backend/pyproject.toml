[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reconcileai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.2", "uvicorn==0.42.0", "sqlalchemy==2.0.54",
  "pydantic==2.14.0", "pydantic-settings==2.13.1", "httpx==0.28.1",
  "python-multipart==0.0.22",
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
