name: Reliability checks
on:
  push:
    branches: [main, 'feat/**', 'test/**', 'docs/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend[dev]'
      - run: ruff check backend evaluation scripts/generate_fixture.py
      - run: ruff format --check backend evaluation scripts/generate_fixture.py
      - run: pytest backend/tests -q
      - run: python -m evaluation.run --output /tmp/evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: /tmp/evaluation.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -e './backend[dev]'
      - run: npm ci && npx playwright install --with-deps chromium && npm run build
        working-directory: frontend
      - run: node scripts/browser-check.mjs
        env:
          REVIEW_OUTPUT: /tmp/reconcileai-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: /tmp/reconcileai-browser/*.png
